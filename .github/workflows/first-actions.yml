on: 

  push:

    branches: [ main ]

  pull_request:

    branches: [ main ]



jobs:

  test-logic:

    runs-on: ubuntu-latest

    # CRITICAL: Grant permission to post comments on Pull Requests

    permissions:

      pull-requests: write

      contents: read



    strategy:

      matrix:

        python-version: [3.9]



    steps:

    - uses: actions/checkout@v3



    - name: Set up Python

      uses: actions/setup-python@v2

      with:

        python-version: ${{ matrix.python-version }}



    - name: Install dependencies

      run: |

        python -m pip install --upgrade pip

        pip install pytest flake8 flask



    - name: Run tests

      id: run_tests

      run: |

        cd src

        python -m pytest addition.py > ../failure.log 2>&1

      continue-on-error: true



    - name: AI Diagnostic (Self-Healing PR Comment)

      if: steps.run_tests.outcome == 'failure'

      env:

        GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

        PR_NUMBER: ${{ github.event.pull_request.number }}

      run: |

        # Install the Copilot CLI extension

        gh extension install github/gh-copilot --force

        

        echo "🤖 AI is diagnosing the failure..."

        

        # Get the AI analysis

        ANALYSIS=$(gh copilot explain "Analyze this pytest failure and suggest a fix: $(cat failure.log | tail -n 15)")

        

        # Post the comment to the PR if it exists

        if [ ! -z "$PR_NUMBER" ]; then

          gh pr comment $PR_NUMBER --body "### 🤖 AI Self-Healing Diagnostic

          **Status:** Test Failed ❌

          

          **AI Analysis & Suggested Fix:**

          $ANALYSIS

          

          ---

          _Generated by GitHub Copilot CLI for Project Phoenix_"

        else

          echo "No PR number detected (Push event). AI Analysis: $ANALYSIS"

        fi



    - name: Final Build Check

      if: steps.run_tests.outcome == 'failure'

      run: exit 1



  # CD Part remains the same

  build-and-push:

    needs: test-logic

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v3

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v2

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: us-east-1



      - name: Login to Amazon ECR

        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v1



      - name: Build, Tag, and Push to ECR

        env:

          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

          ECR_REPOSITORY: my-python-app

        run: |

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest



  deploy-to-ec2:

    needs: build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: SSH into EC2 and Update Container
