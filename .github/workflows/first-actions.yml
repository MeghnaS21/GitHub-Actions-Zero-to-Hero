name: My First GitHub Actions



on: 

  push:

    branches: [ main ]

  pull_request:

    branches: [ main ]



jobs:

  test-logic:

    runs-on: ${{ matrix.os-platforms }}

    strategy:

      matrix:

        os-platforms: [ubuntu-latest] # Simplified for AI testing to save credits

        python-version: [3.9]



    steps:

    - uses: actions/checkout@v3



    - name: Set up Python

      uses: actions/setup-python@v2

      with:

        python-version: ${{ matrix.python-version }}



    - name: Install dependencies

      run: |

        python -m pip install --upgrade pip

        pip install pytest flake8 pytest-cov flask



    - name: Lint with flake8

      run: |

          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics



    - name: Run tests

      id: run_tests

      # 1. NEW: Redirect output to failure.log and allow step to 'fail' gracefully

      run: |

        cd src

        python -m pytest addition.py > ../failure.log 2>&1

      continue-on-error: true



    - name: AI Diagnostic (Self-Healing)

      # 2. NEW: This ONLY runs if 'Run tests' above failed

      if: steps.run_tests.outcome == 'failure'

      env:

        GH_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }} # Your Fine-Grained PAT

      run: |

        # Install the Copilot CLI

        npm install -g @github/copilot-cli

        

        echo "--- 🤖 AI ROOT CAUSE ANALYSIS ---"

        # We pass the failure log to Copilot for an explanation

        # Note: We use the 'explain' command via the gh cli extension

        gh extension install github/gh-copilot || true

        gh copilot explain "The following pytest failed. Analyze the error and suggest a fix: $(cat failure.log | tail -n 20)"



    - name: Personal Failure Alert (Slack)

      if: steps.run_tests.outcome == 'failure'

      uses: rtCamp/action-slack-notify@v2

      env:

        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

        SLACK_TITLE: "Hey @${{ github.actor }}, AI is analyzing your failure! 🤖"

        SLACK_COLOR: '#FF0000'

        SLACK_MESSAGE: |

          *CI Pipeline Failed!* ❌

          *AI Diagnostic started:* Check GitHub Actions logs for the suggested fix.

          *Attention:* <@${{ secrets.SLACK_MEMBER_ID }}>



    - name: Final Build Check

      # 3. NEW: We manually fail the job if tests failed, so CD doesn't trigger

      if: steps.run_tests.outcome == 'failure'

      run: exit 1



  # CD Part of this pipeline remains connected via 'needs'

  build-and-push:

    needs: test-logic

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v3

      - name: Configure AWS credentials

        uses: aws-actions/configure-aws-credentials@v2

        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: us-east-1



      - name: Login to Amazon ECR

        id: login-ecr

        uses: aws-actions/amazon-ecr-login@v1



      - name: Build, Tag, and Push to ECR

        env:

          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}

          ECR_REPOSITORY: my-python-app

        run: |

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

